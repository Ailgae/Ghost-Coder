<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Ghost coder</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand"><img src="../assets/logo.png" alt="Ghost Coder" /></div>
      <div class="sidebar-heading"><span>Projects</span><button id="addProjectBtn" class="icon-btn" type="button" title="Add project" aria-label="Add project">+</button></div>
      <div id="projectsList" class="projects-list"></div>
      <!-- Removed the New chat button -->
      <div class="sidebar-footer">
        <button id="connectionBtn" class="connection-btn server-status-btn" type="button" title="Configure server endpoint"><span class="status-dot" aria-hidden="true"></span><span id="serverStatusText">Checking server…</span></button>
      </div>
    </aside>

    <main class="chat">
      <header class="chat-header"><div id="chatTitle">New chat</div><div id="status" class="chat-status" aria-live="polite">Ready</div></header>
      <div class="messages" id="messages"></div>
      <form id="composerForm" class="composer">
        <textarea id="composerInput" placeholder="Tell the agent what to build or fix…" rows="1"></textarea>
        <div class="composer-footer">
          <div class="composer-tools">
            <button id="settingsBtn" class="settings-btn" type="button" title="Settings" aria-label="Open settings"><span aria-hidden="true">⚙</span></button>
            <label class="model-picker" for="model"><span>Model</span><select id="model" disabled><option value="">Loading models...</option></select></label>
          </div>
          <div class="composer-actions">
            <button id="stopBtn" type="button" class="stop-btn" title="Stop" aria-label="Stop" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="1"/></svg></button>
            <button id="sendBtn" class="send-btn" type="submit" title="Send" aria-label="Send"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 3 18 9-18 9 3-9-3-9Zm4.5 8v2h8v-2h-8Z"/></svg></button>
          </div>
        </div>
      </form>
    </main>
  </div>

  <div id="settingsModal" class="modal" hidden><form id="settingsForm" class="modal-card"><h2>Settings</h2><label class="toggle-row" for="streamResponses"><span class="toggle-copy"><strong>Stream responses</strong><small>Show the response as it is generated</small></span><span class="toggle-switch"><input id="streamResponses" type="checkbox" role="switch" /><span class="toggle-slider" aria-hidden="true"></span></span></label><label class="toggle-row" for="allowGit"><span class="toggle-copy"><strong>Allow Git modifications</strong><small>Let the agent run Git commands and modify repository metadata</small></span><span class="toggle-switch"><input id="allowGit" type="checkbox" role="switch" /><span class="toggle-slider" aria-hidden="true"></span></span></label><div class="modal-actions"><button id="cancelSettingsBtn" type="button" class="secondary-btn">Cancel</button><button id="saveSettingsBtn" type="submit">Save</button></div></form></div>
  <div id="connectionModal" class="modal" hidden><form id="connectionForm" class="modal-card"><h2>Server endpoint</h2><label class="field-label" for="serverUrl">Ollama server endpoint</label><input id="serverUrl" type="text" placeholder="http://localhost:11434" /><div class="modal-actions"><button id="cancelConnectionBtn" type="button" class="secondary-btn">Cancel</button><button id="connectBtn" type="submit">Save and connect</button></div></form></div>
  <div id="projectModal" class="modal" hidden><form id="projectForm" class="modal-card"><h2 id="projectModalTitle">Add project</h2><label class="field-label" for="projectName">Project name</label><input id="projectName" type="text" placeholder="My project" /><label class="field-label" for="projectPath">Project directory</label><div class="dir-row"><input id="projectPath" type="text" placeholder="/path/to/project" /><button id="pickProjectDirBtn" type="button" title="Choose folder">📁</button></div><div class="modal-actions"><button id="removeProjectBtn" type="button" class="danger-btn" hidden>Remove project</button><span class="modal-actions-spacer"></span><button id="cancelProjectBtn" type="button" class="secondary-btn">Cancel</button><button type="submit">Save project</button></div></form></div>
  <script src="renderer.js"></script>
</body>
</html>
